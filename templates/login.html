<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NoteFlow — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('stylesheet') }}">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
    catch (error) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="{{ url_for('login') }}">
      <span class="brand-logo"><i data-lucide="sticky-note" aria-hidden="true"></i></span>
      <span class="brand-name">NoteFlow</span>
    </a>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-intro">
        <p class="eyebrow">YOUR NOTES, IN GOOD ORDER</p>
        <h1 id="auth-title">A little space to think.</h1>
        <p>Sign in to keep writing, or create an account to start your library.</p>
      </div>

      {% if error_message %}
        <div class="error-msg" role="alert">
          <i data-lucide="circle-alert" aria-hidden="true"></i><span>{{ error_message }}</span>
        </div>
      {% endif %}

      <div class="auth-tabs" role="tablist" aria-label="Account options">
        <button type="button" class="mode-btn{% if active_form != 'signup' %} active{% endif %}" id="tab-login" role="tab" aria-selected="{{ 'true' if active_form != 'signup' else 'false' }}" aria-controls="form-login-pane">Sign in</button>
        <button type="button" class="mode-btn{% if active_form == 'signup' %} active{% endif %}" id="tab-signup" role="tab" aria-selected="{{ 'true' if active_form == 'signup' else 'false' }}" aria-controls="form-signup-pane">Create account</button>
      </div>

      <form action="{{ url_for('login') }}" method="post" id="form-login-pane" class="auth-form" {% if active_form == 'signup' %}hidden{% endif %}>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url|default('') }}">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" name="username" id="login-username" value="{{ username_input|default('') }}" autocomplete="username" maxlength="50" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" name="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign in <i data-lucide="arrow-right" aria-hidden="true"></i></button>
      </form>

      <form action="{{ url_for('signup') }}" method="post" id="form-signup-pane" class="auth-form" {% if active_form != 'signup' %}hidden{% endif %}>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input type="text" name="username" id="signup-username" value="{{ username_input|default('') }}" autocomplete="username" maxlength="50" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password <span class="field-hint">8 characters or more</span></label>
          <input type="password" name="password" id="signup-password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary">Create account <i data-lucide="arrow-right" aria-hidden="true"></i></button>
      </form>
      <p class="auth-footnote">We only store a secure password hash. Your notes stay yours.</p>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const loginForm = document.getElementById('form-login-pane');
      const signupForm = document.getElementById('form-signup-pane');
      function selectTab(signup) {
        loginTab.classList.toggle('active', !signup);
        signupTab.classList.toggle('active', signup);
        loginTab.setAttribute('aria-selected', String(!signup));
        signupTab.setAttribute('aria-selected', String(signup));
        loginForm.hidden = signup;
        signupForm.hidden = !signup;
      }
      loginTab.addEventListener('click', () => selectTab(false));
      signupTab.addEventListener('click', () => selectTab(true));
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
