<!-- VIEW: CREATE / EDIT NOTE -->
<div class="hero-section">
  <h1>Create & Share a Note</h1>
  <p>Write standard notes, documentation or code snippets, customize security and expiration, and save them dynamically.</p>
</div>

<form action="/create" method="POST" class="editor-grid">
  <!-- Left Panel: Note Inputs -->
  <div class="editor-main-card glass-panel">
    <div class="editor-header">
      <input type="text" name="title" id="note-title" placeholder="Untitled Note..." required autocomplete="off" value="Welcome to NoteFlow">
      <div class="editor-modes">
        <label for="preview-toggle-cb" class="mode-btn mode-btn-write">Write</label>
        <label for="preview-toggle-cb" class="mode-btn mode-btn-preview">Preview</label>
      </div>
    </div>

    <!-- Mode Checkbox (styled in style.css to toggle visibility) -->
    <input type="checkbox" id="preview-toggle-cb" class="state-preview-toggle" style="display:none;">

    <!-- Input Area -->
    <div class="textarea-container" id="editor-write-pane">
      <textarea name="content" id="note-body" placeholder="Write something incredible here... "># Getting Started with NoteFlow

Welcome to NoteFlow, a premium note sharing platform! Here are some quick tips to get started:

- **Create Notes**: Write down your thoughts, instructions, or code snippets in this editor.
- **Categories**: Organize your library using categories like Personal, Work, Code, Ideas, or Journal.
- **Security**: Toggle password protection in the sidebar settings to secure sensitive notes.
- **Share**: Publish to the Public Feed or share the generated URL link with others.</textarea>
    </div>

    <!-- Preview Area -->
    <div class="preview-container" id="editor-preview-pane">
      <!-- Preview content populated dynamically by JavaScript below -->
    </div>

    <!-- Editor Footer Statistics -->
    <div class="editor-stats">
      <div class="stat-item"><i data-lucide="file-text"></i> <span id="stat-words">0</span> words</div>
      <div class="stat-item"><i data-lucide="clock"></i> <span id="stat-read-time">1</span> min read</div>
      <div class="stat-item"><i data-lucide="align-left"></i> <span id="stat-chars">0</span> characters</div>
    </div>
  </div>

  <!-- Right Panel: Configurations -->
  <div class="editor-side-card glass-panel">
    <h3>Settings & Sharing</h3>
    
    <div class="form-group">
      <label for="note-category"><i data-lucide="tag"></i> Category / Tag</label>
      <select name="category" id="note-category">
        <option value="Personal">Personal</option>
        <option value="Work">Work</option>
        <option value="Code" selected>Code</option>
        <option value="Ideas">Ideas</option>
        <option value="Journal">Journal</option>
      </select>
    </div>

    <div class="form-group">
      <label for="note-expiry"><i data-lucide="timer"></i> Expiration</label>
      <select name="expiry" id="note-expiry">
        <option value="never" selected>Never</option>
        <option value="burn">Burn after reading</option>
        <option value="1h">1 hour</option>
        <option value="24h">24 hours</option>
      </select>
    </div>

    <div class="form-group">
      <label class="checkbox-label" style="cursor: pointer;">
        <input type="checkbox" id="password-toggle-checkbox" style="margin-right: 8px;">
        <span>Enable Password Protection</span>
      </label>
      <input type="password" name="password" id="note-password-input" placeholder="Enter password..." class="form-group" style="display:none; margin-top:8px;">
    </div>

    <div class="form-group">
      <label class="checkbox-label" style="cursor: pointer;">
        <input type="checkbox" name="is_public" value="1" checked>
        <span>Publish to Public Feed</span>
      </label>
    </div>

    <div class="editor-actions">
      <button type="submit" class="btn btn-primary btn-glow">
        <i data-lucide="share-2"></i> Save & Share Note
      </button>
      <a href="/library" class="btn btn-secondary" style="text-decoration:none; text-align:center;">
        <i data-lucide="folder"></i> View My Library
      </a>
    </div>
  </div>
</form>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const bodyInput = document.getElementById('note-body');
    const previewPane = document.getElementById('editor-preview-pane');
    
    const statWords = document.getElementById('stat-words');
    const statChars = document.getElementById('stat-chars');
    const statReadTime = document.getElementById('stat-read-time');

    // Real-time markdown parser & stats counter
    function handleInput() {
      const text = bodyInput.value;
      
      // Calculate Stats
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const readTime = Math.max(1, Math.ceil(words / 200));

      statWords.textContent = words;
      statChars.textContent = chars;
      statReadTime.textContent = readTime;

      // Simple Markdown Parsing
      let parsed = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        // Headings
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Bold / Italic
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        // Lists (ul/li)
        .replace(/^\- (.*$)/gim, '<li>$1</li>')
        // Code Blocks
        .replace(/```css\n([\s\S]*?)```/gim, '<pre><code class="css">$1</code></pre>')
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>');

      // Fix wrapping list items in list tags
      if (parsed.includes('<li>')) {
        // Group consecutive <li>s
        parsed = parsed.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
      }

      previewPane.innerHTML = parsed;
    }

    bodyInput.addEventListener('input', handleInput);
    handleInput(); // run once on load

    // Mode Toggle Checkbox handling
    const previewToggle = document.getElementById('preview-toggle-cb');
    const writePane = document.getElementById('editor-write-pane');
    const previewBtn = document.querySelector('.mode-btn-preview');
    const writeBtn = document.querySelector('.mode-btn-write');

    previewToggle.addEventListener('change', () => {
      if (previewToggle.checked) {
        writePane.style.display = 'none';
        previewPane.style.display = 'block';
        previewBtn.classList.add('active');
        writeBtn.classList.remove('active');
      } else {
        writePane.style.display = 'flex';
        previewPane.style.display = 'none';
        previewBtn.classList.remove('active');
        writeBtn.classList.add('active');
      }
    });

    // Password fields toggle
    const pwCheckbox = document.getElementById('password-toggle-checkbox');
    const pwInput = document.getElementById('note-password-input');
    pwCheckbox.addEventListener('change', () => {
      pwInput.style.display = pwCheckbox.checked ? 'block' : 'none';
      if (!pwCheckbox.checked) pwInput.value = '';
    });
  });
</script>
