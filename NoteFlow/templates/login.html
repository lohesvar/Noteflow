<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow - Sign In or Sign Up</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/style.css">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
  <!-- Background Glow Effects -->
  <div class="glow-sphere glow-sphere-1"></div>
  <div class="glow-sphere glow-sphere-2"></div>

  <!-- Centered Glass Card -->
  <div class="glass-panel login-card" style="width: 100%; max-width: 420px; padding: 40px; border-radius: 20px; position: relative; z-index: 10;">
    
    <!-- Header Brand -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 32px;">
      <div class="brand-logo" style="width: 34px; height: 34px; border-radius: 8px;">
        <i data-lucide="sticky-note" style="width: 18px; height: 18px;"></i>
      </div>
      <span class="brand-name" style="font-size: 1.4rem;">NoteFlow</span>
    </div>

    <!-- Error Alert Banner -->
    <div class="error-msg" style="display: {{ error_display }}; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin-bottom: 24px; text-align: center; align-items: center; justify-content: center; gap: 8px;">
      <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
      <span>{{ error_message }}</span>
    </div>

    <!-- Form Tab Toggles -->
    <div class="editor-modes" style="margin-bottom: 28px; width: 100%; display: flex;">
      <button class="mode-btn active" id="tab-login" style="flex: 1; text-align: center;">Sign In</button>
      <button class="mode-btn" id="tab-signup" style="flex: 1; text-align: center;">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form action="/login" method="POST" id="form-login-pane" style="display: flex; flex-direction: column; gap: 20px;">
      <div class="form-group">
        <label for="login-username"><i data-lucide="user"></i> Username</label>
        <input type="text" name="username" id="login-username" placeholder="Enter your username..." required autocomplete="off" style="padding: 12px 16px;">
      </div>
      
      <div class="form-group">
        <label for="login-password"><i data-lucide="key-round"></i> Password</label>
        <input type="password" name="password" id="login-password" placeholder="Enter your password..." required style="padding: 12px 16px;">
      </div>

      <button type="submit" class="btn btn-primary btn-glow" style="margin-top: 8px; width: 100%;">
        Sign In <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
      </button>
    </form>

    <!-- SIGNUP FORM -->
    <form action="/signup" method="POST" id="form-signup-pane" style="display: none; flex-direction: column; gap: 20px;">
      <div class="form-group">
        <label for="signup-username"><i data-lucide="user"></i> Choose Username</label>
        <input type="text" name="username" id="signup-username" placeholder="Username (letters/numbers)..." required autocomplete="off" style="padding: 12px 16px;">
      </div>
      
      <div class="form-group">
        <label for="signup-password"><i data-lucide="key-round"></i> Choose Password</label>
        <input type="password" name="password" id="signup-password" placeholder="Minimum 4 characters..." required style="padding: 12px 16px;">
      </div>

      <button type="submit" class="btn btn-primary btn-glow" style="margin-top: 8px; width: 100%;">
        Create Account <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i>
      </button>
    </form>

  </div>

  <!-- Form Toggler Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const formLogin = document.getElementById('form-login-pane');
      const formSignup = document.getElementById('form-signup-pane');

      // Default state selector based on error message or query context
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'signup') {
        showSignup();
      }

      tabLogin.addEventListener('click', showLogin);
      tabSignup.addEventListener('click', showSignup);

      function showLogin() {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        formLogin.style.display = 'flex';
        formSignup.style.display = 'none';
      }

      function showSignup() {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        formLogin.style.display = 'none';
        formSignup.style.display = 'flex';
      }

      // Initialize Lucide Icons
      lucide.createIcons();
    });
  </script>
</body>
</html>
